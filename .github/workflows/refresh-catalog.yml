name: Daily catalog refresh

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  discover-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover new licensed projects from GitHub topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-catalog.js

      - name: Skip deployment work when catalog is unchanged
        id: catalog-change
        run: |
          if git diff --quiet -- data/tools.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No newly qualified projects; no changes to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Catalog has new entries; validation and build will run."
          fi

      - name: Install dependencies
        if: steps.catalog-change.outputs.changed == 'true'
        run: npm install --no-audit --no-fund

      - name: Validate catalog schema
        if: steps.catalog-change.outputs.changed == 'true'
        run: npm run validate:data

      - name: Build and verify all routes
        if: steps.catalog-change.outputs.changed == 'true'
        run: npm run build

      - name: Publish catalog update
        if: steps.catalog-change.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tools.json
          git commit -m "chore(catalog): add newly discovered open-source tools"
          git push origin HEAD:main
