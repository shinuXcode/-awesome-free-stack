name: Research 5,000+ New Tool Candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-5000-tools-manual
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check requests reportlab
      - name: Research and generate PDF, CSV and JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/research-5000-tools.py
      - name: Upload the full report bundle
        uses: actions/upload-artifact@v4
        with:
          name: 5000-tool-candidates-research
          path: |
            output/5000-tool-candidates.pdf
            output/5000-tool-candidates.csv
            output/5000-tool-candidates.json
          if-no-files-found: error
          retention-days: 30
