name: Research 5000 Open-Source Project Candidates

on:
  push:
    branches:
      - research/5000-open-source-tools-fast

permissions:
  contents: read

concurrency:
  group: research-5000-open-source-tools-fast
  cancel-in-progress: false

jobs:
  discover-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the research branch and catalog snapshot
        uses: actions/checkout@v4
        with:
          ref: research/5000-open-source-tools-fast

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF generator
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Research, deduplicate and generate PDF, CSV and JSON
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          TARGET_CANDIDATES: "5000"
        run: python scripts/research_5000_open_source_tools.py

      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: 5000-open-source-project-candidates
          path: research-output/
          if-no-files-found: error
          retention-days: 14
