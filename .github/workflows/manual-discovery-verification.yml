name: Manual catalog discovery verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-discovery-verification
  cancel-in-progress: false

jobs:
  verify-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore resumable discovery checkpoint
        uses: actions/cache/restore@v4
        with:
          path: scraper/.checkpoint.json
          key: scraper-checkpoint-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scraper-checkpoint-${{ github.ref_name }}-
      - name: Install website dependencies
        run: npm ci
      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install --no-audit --no-fund
      - name: Verify scraper code and unit tests
        run: |
          node --check scraper/discover.mjs
          node --check scraper/scoring.mjs
          node --check scraper/github-api.mjs
          node --check scraper/checkpoint.mjs
          cd scraper && npm test
      - name: Discover and stage candidates locally (never commits or publishes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPER_MAX_API_LOOKUPS: "300"
          SCRAPER_MAX_NEW_TOOLS: "40"
        run: npm run discover --prefix scraper
      - name: Validate the resulting catalog
        run: npm run validate:data
      - name: Build the website with the staged catalog
        run: npm run build
      - name: Save checkpoint if quota prevented completion
        if: always() && hashFiles('scraper/.checkpoint.json') != ''
        uses: actions/cache/save@v4
        with:
          path: scraper/.checkpoint.json
          key: scraper-checkpoint-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload staged catalog for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-discovery-verification
          path: data/tools.json
          if-no-files-found: error
          retention-days: 7
