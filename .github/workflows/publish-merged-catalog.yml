name: Publish merged catalog and README counts
on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - "data/tools.json"
      - "README.md"
      - "scripts/sync-readme-stats.js"
      - ".github/workflows/publish-merged-catalog.yml"
permissions:
  contents: write
concurrency:
  group: publish-merged-catalog
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the merged main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate merged catalog
        run: npm run validate:data
      - name: Refresh catalog statistics in README
        run: npm run sync:readme
      - name: Commit README statistics if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README statistics already match the catalog."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync catalog statistics after merge"
          git push origin HEAD:main
