name: Manual catalog refresh (review required)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  discover-validate-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record source catalog revision
        id: source-base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Discover new licensed projects from GitHub topics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-catalog.js

      - name: Detect catalog changes
        id: catalog-change
        run: |
          if git diff --quiet -- data/tools.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No newly qualified projects; no pull request is needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Catalog changes detected; validation and build are required."
          fi

      - name: Install dependencies
        if: steps.catalog-change.outputs.changed == 'true'
        run: npm install --no-audit --no-fund

      - name: Validate catalog schema
        if: steps.catalog-change.outputs.changed == 'true'
        run: npm run validate:data

      - name: Verify source evidence and GitHub repository health
        if: steps.catalog-change.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.source-base.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run validate:changed-tools -- --base "$BASE_SHA"

      - name: Build and verify all routes
        if: steps.catalog-change.outputs.changed == 'true'
        run: npm run build

      - name: Propose catalog update as a pull request (never push to main)
        if: steps.catalog-change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/catalog-refresh
          delete-branch: true
          add-paths: data/tools.json
          commit-message: "chore(catalog): propose newly discovered open-source tools"
          title: "Automated catalog refresh — review required"
          body: |
            This pull request was generated by the manual catalog refresh workflow.

            Before merging, review tool relevance, official-source links, license evidence, pricing claims, duplicates, and category quality. Schema validation, changed-source checks, and the production build must pass first.

            This workflow does not push to `main` or deploy to production. A human must review and merge this pull request.
          labels: |
            catalog
            needs-review
