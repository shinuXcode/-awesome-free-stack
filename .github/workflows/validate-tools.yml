name: Validate tool directory
on:
  pull_request:
    paths:
      - "data/tools.json"
      - "scripts/validate-json.js"
  push:
    branches: [main]
    paths:
      - "data/tools.json"
      - "scripts/validate-json.js"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-json.js